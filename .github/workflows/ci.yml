name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (core)
        run: cargo test
      - name: Test (with menu bar / tray)
        run: cargo test --features bar
      - name: Release build
        run: cargo build --release --features bar
      # The README's Windows steps 2-3 as written (minus the tray and the
      # toast, which need a desktop session), then the uninstall line.
      # Output is captured so PowerShell waits for the GUI-subsystem tachi-bar.
      - name: Install smoke test (README steps)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo install --path . --locked --features bar
          $out = tachi-noti install 2>&1; $out
          $out = tachi-bar install-agent 2>&1; $out
          $doctor = (tachi-noti doctor 2>&1) -join "`n"; $doctor
          foreach ($want in @('AUMID TachiNoti.Tachi registered', '(present)', 'tachi-bar.exe" activate')) {
            if (-not $doctor.Contains($want)) { throw "doctor output lacks: $want" }
          }
          $settings = Get-Content "$env:USERPROFILE\.claude\settings.json" -Raw
          if (-not $settings.Contains('/.cargo/bin/tachi-noti.exe hook')) { throw 'hooks not installed with a forward-slash path' }
          $out = tachi-bar uninstall-agent 2>&1; $out
          tachi-noti uninstall
          tachi-noti unregister
          $doctor = (tachi-noti doctor 2>&1) -join "`n"
          if (-not $doctor.Contains('not registered')) { throw 'unregister left the AUMID behind' }
      # The README's status line chain as written, on both OSes (Git Bash on
      # Windows): the capture stage must hand the payload to the script.
      - name: Status line script smoke test
        shell: bash
        run: |
          payload='{"model":{"display_name":"Opus 5.5"},"context_window":{"used_percentage":12}}'
          out=$(printf '%s' "$payload" | target/release/tachi-noti statusline --chain 'bash contrib/statusline/context-usage.sh')
          printf '%s\n' "$out"
          case "$out" in *"Opus 5.5"*"ctx 12%"*) ;; *) echo "unexpected status line: $out"; exit 1 ;; esac
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tachi-noti-${{ matrix.os }}
          path: |
            target/release/tachi-noti
            target/release/tachi-bar
            target/release/tachi-noti.exe
            target/release/tachi-bar.exe
          if-no-files-found: error
