name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test (core)
        run: cargo test
      - name: Test (with menu bar / tray)
        run: cargo test --features bar
      - name: Release build
        run: cargo build --release --features bar
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tachi-noti-${{ matrix.os }}
          path: |
            target/release/tachi-noti
            target/release/tachi-bar
            target/release/tachi-noti.exe
            target/release/tachi-bar.exe
          if-no-files-found: error
