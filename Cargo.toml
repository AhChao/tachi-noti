[package]
name = "tachi-noti"
version = "0.1.0"
edition = "2024"
description = "Tachi the butler collie delivers native macOS notifications for Claude Code hooks"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
dirs = "6"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
