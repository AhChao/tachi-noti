[package]
name = "tachi-noti"
version = "0.2.0"
edition = "2024"
description = "Tachi the butler collie delivers native macOS and Windows notifications for Claude Code hooks"
license = "MIT"

[lib]
name = "tachi_noti"
path = "src/lib.rs"

[[bin]]
name = "tachi-noti"
path = "src/main.rs"

[[bin]]
name = "tachi-bar"
path = "src/bin/tachi-bar.rs"
required-features = ["bar"]

[features]
default = []
# Menu bar (macOS, AppKit) / system tray (Windows, tray-icon). Each dep below
# is target-scoped, so the feature only pulls in the current OS's toolkit.
bar = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-app-kit", "dep:tray-icon", "dep:png"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
toml_edit = "0.22"
dirs = "6"

# macOS: libproc / kill for process introspection, AppKit for the menu bar.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSString", "NSDate", "NSTimer", "NSRunLoop", "NSThread", "NSObjCRuntime",
    "NSAttributedString", "NSArray", "NSDictionary", "NSValue", "NSRange", "NSData", "NSGeometry",
] }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSApplication", "NSRunningApplication", "NSResponder",
    "NSStatusBar", "NSStatusItem", "NSStatusBarButton",
    "NSMenu", "NSMenuItem", "NSButton", "NSControl", "NSView", "NSCell",
    "NSImage", "NSColor", "NSAttributedString", "NSFont",
] }

# Windows: WinRT toasts + Win32 process/window/registry/shell APIs (Microsoft's
# official bindings), tray-icon + png for the system tray.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = { version = "0.26", optional = true }
png = { version = "0.18", optional = true }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
